# @NAME@ — scenario metadata. Keys: docs/SCENARIO-FORMAT.md §2 (any other key fails lint, except P_<NAME>).
NAME=@NAME@
PURPOSE="TODO: one sentence: what this scenario proves"
PLAYERS="@PLAYERS@"            # login names in slot order (at most 3): slot 1 -> RIG_DISPLAY, 2 -> RIG_DISPLAY2, ...
# PASSWORDS="..."              # in PLAYERS order; default: each player's name
TAGS="@TAGS@"                  # free words for `bin/rig run --tag` / `bin/rig list --tag`
CONTENT=@CONTENT@              # a content profile from rig.conf (RIG_CONTENT_@CONTENT@_DATA / _FILES)
FIXTURE=.                      # server state to resume: player/ cell/ world/ map/ recordstore/ custom/ in
                               # this dir (docs/WRITING-SCENARIOS.md §1-2); - = blank state, log in fresh
# OVERLAY=overlay              # CoreScripts overlay dir: server-side test hooks (<file>.append appends)
# SETTINGS=settings.cfg        # a client settings.cfg seeded into every client profile
# PROBE=1                      # load the client probe: probe / assert probe (OpenMW >= 0.48 clients)
# PROBE_RANGE=4096             # the probe's nearby/items radius here (default: RIG_PROBE_RANGE, 2048)
LOG_MARKERS="$RIG_TRIPWIRES"   # what `signature` keeps from the server log: add your deterministic event lines
COST=3                         # approximate minutes on software GL
# WIGGLE=0                     # do not start the idle wiggler (it keeps the vanity camera away)
# P_EXAMPLE=value              # a parameter: steps.sh reads it as $P_EXAMPLE
