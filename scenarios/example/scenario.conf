# The free-content example: two clients join one server on OpenMW's example-suite and see each other.
# Format: docs/SCENARIO-FORMAT.md. Run: bin/rig run scenarios/example
NAME=example
PURPOSE="two clients join one world on free example-suite content and each sees the other"
PLAYERS="a b"
PASSWORDS="a a"                  # b.json reuses a's login block, so both passwords are "a"
TAGS="example content:example"
CONTENT=example                  # RIG_CONTENT_example_* in rig.conf (or the older EXAMPLE_SUITE key)
FIXTURE=.                        # player/a.json + player/b.json: two returning players in cell 0, -7
OVERLAY=coreScripts-overlay      # the compat shim stock CoreScripts need on non-Morrowind content
SETTINGS=settings.cfg            # [Models] remap: the client finds BasicPlayer.dae
LOG_MARKERS="was allowed to connect|Creating new player|example-suite-compat|Authority of cell 0, -7 is now a|$RIG_TRIPWIRES"
COST=3
