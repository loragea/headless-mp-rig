# teach-setup-by-command — set up state with server-pushed commands instead of editing the fixture.
# Keys: docs/SCENARIO-FORMAT.md §2. Run: bin/rig run scenarios/teach-setup-by-command
NAME=teach-setup-by-command
PURPOSE="server-pushed console commands and server Lua move a player, change stats and place an object on an unedited shared fixture, and each change is read back"
PLAYERS="a b"
PASSWORDS="a a"
TAGS="teach probe setup content:example"
CONTENT=example
FIXTURE=../teaching-fixture                           # left as authored: this test changes state at run time
OVERLAY=../teaching-fixture/coreScripts-overlay
SETTINGS=../teaching-fixture/settings.cfg
PROBE=1
PROBE_RANGE=1024
COST=2
P_X=3584                                              # where the console command puts a (the fixture has 4096)
P_LEVEL=5                                             # b's level after setup/b-level.lua ($P_LEVEL is substituted in it)
