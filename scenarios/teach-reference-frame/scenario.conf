# teach-reference-frame — a frame compared against a blessed reference image.
# Keys: docs/SCENARIO-FORMAT.md §2. Run: bin/rig run --strict-refs scenarios/teach-reference-frame
NAME=teach-reference-frame
PURPOSE="with the hour pinned and the weather checked, a's static view of the empty floor matches the blessed reference within its calibrated tolerance"
PLAYERS="a"                                           # one player: nothing else moves in the view
PASSWORDS="a"
TAGS="teach frames probe content:example"
CONTENT=example
FIXTURE=../teaching-fixture                           # a faces east over empty floor (b stays logged out)
OVERLAY=../teaching-fixture/coreScripts-overlay
SETTINGS=../teaching-fixture/settings.cfg
PROBE=1                                               # to check the hour and weather before the shot
COST=1
P_HOUR=12                                             # the hour the view is lit at (setup/pin-hour.lua)
P_CROP=600x200+340+340                                # horizon and floor: no sky (clouds drift), no HUD, no chat notice
