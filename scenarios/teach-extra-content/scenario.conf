# teach-extra-content — load an extra plugin for one scenario and check every client has its object.
# Keys: docs/SCENARIO-FORMAT.md §2. Run: bin/rig run scenarios/teach-extra-content
NAME=teach-extra-content
PURPOSE="a scenario-local plugin loads in the same order on the server and both clients, and both clients' engines hold the item it places"
PLAYERS="a b"
PASSWORDS="a a"
TAGS="teach probe content:example"
CONTENT=example                                       # the profile's files load first: template.omwgame
CONTENT_EXTRA=content/teach-token.omwaddon            # then this plugin, on every client and in the server's list
FIXTURE=../teaching-fixture
OVERLAY=../teaching-fixture/coreScripts-overlay
SETTINGS=../teaching-fixture/settings.cfg
PROBE=1                                               # loads after CONTENT_EXTRA, always last
PROBE_RANGE=1024
COST=2
P_ITEM=teach_token                                    # the record id make-addon.py writes
