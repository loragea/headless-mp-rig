# teach-log-witness — the simplest test: two players log in, and log lines prove each sees the other.
# Keys: docs/SCENARIO-FORMAT.md §2. Run: bin/rig run scenarios/teach-log-witness
NAME=teach-log-witness
PURPOSE="two players log in and the server and client logs prove each client created the other"
PLAYERS="a b"                                         # slot 1 -> RIG_DISPLAY, slot 2 -> RIG_DISPLAY2
PASSWORDS="a a"                                       # the fixture's b reuses a's login block
TAGS="teach content:example"
CONTENT=example                                       # RIG_CONTENT_example_* in rig.conf: free example-suite data
FIXTURE=../teaching-fixture                           # one fixture shared by every teach-* scenario
OVERLAY=../teaching-fixture/coreScripts-overlay       # server scripts the free content needs
SETTINGS=../teaching-fixture/settings.cfg             # client settings the free content needs
COST=2
