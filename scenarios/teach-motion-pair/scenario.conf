# teach-motion-pair — a frame pair proves motion: no reference image, nothing to bless.
# Keys: docs/SCENARIO-FORMAT.md §2. Run: bin/rig run scenarios/teach-motion-pair
NAME=teach-motion-pair
PURPOSE="b walks sideways into an empty part of a's view and a's frames of it differ, while two frames with nobody there do not"
PLAYERS="a b"
PASSWORDS="a a"
TAGS="teach frames content:example"
CONTENT=example
FIXTURE=../teaching-fixture                           # a and b face each other 256 units apart: b is centred in a's view
OVERLAY=../teaching-fixture/coreScripts-overlay
SETTINGS=../teaching-fixture/settings.cfg
COST=2
P_CROP=140x220+340+300                                # empty floor left of b on a's screen, where b walks to (WxH+X+Y)
