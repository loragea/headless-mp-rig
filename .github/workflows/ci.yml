name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-selftest:
    runs-on: ubuntu-latest
    # The compare library calls ImageMagick 7's `magick` CLI. Ubuntu runners ship ImageMagick 6
    # (no `magick`); Debian 13 ships 7, so the job runs in a Debian 13 container. The scenario
    # selftest's `assert json` case needs python3.
    container: debian:trixie-slim
    steps:
      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git shellcheck imagemagick python3
      - uses: actions/checkout@v4
      - name: Shell lint
        run: shellcheck -S warning lib/*.sh bin/*.sh bin/rig templates/*.sh
      - name: Selftest lib/compare.sh
        run: lib/compare.sh selftest
      - name: Selftest lib/logcheck.sh
        run: lib/logcheck.sh selftest
      - name: Selftest lib/scenario.sh
        run: lib/scenario.sh selftest
      - name: Dry-run the example scenario
        run: bin/rig run --dry-run scenarios/example
      - name: Lint the example scenario
        run: bin/rig lint scenarios/example
      - name: Scaffold a scenario from the template and lint it
        run: t=$(mktemp -d) && bin/rig new "$t/t1" --players "a b" --content example && bin/rig lint "$t/t1"
